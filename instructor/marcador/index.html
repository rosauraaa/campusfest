<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Marcador · CampusFest</title>
  <style>
    @font-face { font-family: "Outfit"; src: url("/fonts/Outfit-Variable.ttf") format("truetype"); font-weight: 100 900; }
    :root {
      --ink: #15161a; --panel: #1f2026; --rule: #30323a; --text: #ffffff; --soft: #b9bac2;
      --l0: #0a62b8; --l1: #d81e6c; --l2: #d85d0c; --l3: #7b2d9c; --l4: #0c8a49; --l5: #0a62b8; --l6: #d81e6c; --l7: #d85d0c;
      --gold: #f2c230;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "Outfit", system-ui, sans-serif; background: var(--ink); color: var(--text); font-variant-numeric: tabular-nums; }
    header { display: flex; justify-content: space-between; align-items: end; gap: 24px; padding: 28px 48px 18px; }
    h1 { margin: 0; font-size: 46px; font-weight: 800; letter-spacing: -0.02em; line-height: 1; }
    h1 span { display: block; margin-top: 8px; font-size: 20px; font-weight: 500; color: var(--soft); letter-spacing: 0; }
    .status { text-align: right; color: var(--soft); font-size: 16px; }
    .status b { color: var(--text); }
    .legend { display: flex; gap: 18px; flex-wrap: wrap; padding: 0 48px 14px; color: var(--soft); font-size: 15px; }
    .legend span { display: inline-flex; align-items: center; gap: 6px; }
    .legend i { width: 12px; height: 12px; border-radius: 50%; border: 3px solid currentColor; }
    ol { list-style: none; margin: 0; padding: 0 48px 48px; display: grid; gap: 10px; }
    li { display: grid; grid-template-columns: 56px minmax(180px, 1fr) auto auto 92px; align-items: center; gap: 24px; padding: 14px 22px; border-radius: 16px; background: var(--panel); }
    li.top1 { box-shadow: inset 0 0 0 2px var(--gold); }
    .rank { font-size: 30px; font-weight: 800; color: var(--soft); }
    .top1 .rank { color: var(--gold); }
    .user { font-size: 24px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .user small { display: block; font-size: 14px; font-weight: 500; color: var(--soft); }
    .line { position: relative; display: flex; gap: 18px; align-items: center; padding: 0 4px; }
    .line::before { content: ""; position: absolute; left: 10px; right: 10px; top: 50%; height: 6px; margin-top: -3px; border-radius: 3px; background: var(--rule); }
    .stop { position: relative; width: 24px; height: 24px; border-radius: 50%; background: var(--ink); border: 5px solid var(--rule); }
    .stop.ok { border-color: var(--c); background: var(--c); }
    .stop.guided { width: 30px; height: 30px; }
    .badges { display: flex; gap: 8px; }
    .badge { padding: 5px 12px; border-radius: 999px; font-size: 14px; font-weight: 600; color: var(--soft); border: 1.5px solid var(--rule); }
    .badge.ok { color: var(--ink); background: var(--text); border-color: var(--text); }
    .score { font-size: 38px; font-weight: 800; text-align: right; }
    .empty { padding: 48px; color: var(--soft); font-size: 22px; }
  </style>
</head>
<body>
  <header>
    <h1>Marcador CampusFest<span>El pipeline es el juez · código publicado en GitHub Pages</span></h1>
    <div class="status" id="status">Cargando…</div>
  </header>
  <div class="legend" id="legend"></div>
  <ol id="board"></ol>

  <script>
    const colors = ['--l0', '--l1', '--l2', '--l3', '--l4', '--l5', '--l6', '--l7'];
    const esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);

    async function load() {
      try {
        const data = await (await fetch('/api/marcador', { cache: 'no-store' })).json();
        document.getElementById('legend').innerHTML =
          data.checks.map((c, i) => `<span style="color:var(${colors[i]})"><i></i>${esc(c.label)} · ${c.points}</span>`).join('')
          + '<span>Publicado · 10</span><span>PR fusionado · 5</span><span>Respaldo · 5</span>';
        const time = data.lastRun ? new Date(data.lastRun).toLocaleTimeString('es-MX', { hour: '2-digit', minute: '2-digit', second: '2-digit' }) : '—';
        document.getElementById('status').innerHTML =
          `<b>${data.players.length}</b> participantes · máximo <b>${data.max}</b> pts<br>Actualizado ${time}${data.source === 'raw' ? ' · <b>plan B: rama main</b>' : ''}${data.lastError ? `<br>⚠️ ${esc(data.lastError)}` : ''}`;
        const board = document.getElementById('board');
        if (data.players.length === 0) {
          board.innerHTML = '<div class="empty">Esperando participantes… Comenta tu usuario de GitHub en el Issue del taller.</div>';
          return;
        }
        board.innerHTML = data.players.map((p, i) => `
          <li class="${i === 0 && p.score > 0 ? 'top1' : ''}">
            <span class="rank">${i + 1}</span>
            <span class="user">${esc(p.user)}<small>${esc(p.repo)}${p.commit ? ` · ${esc(p.commit)}` : ''}${p.checks?.loadError ? ' · ⚠️ su logic.js no carga' : ''}</small></span>
            <span class="line">${data.checks.map((c, j) => `<span class="stop ${p.checks?.[c.id] === true ? 'ok' : ''} ${j === 0 ? 'guided' : ''}" style="--c:var(${colors[j]})" title="${esc(c.label)}"></span>`).join('')}</span>
            <span class="badges">
              <span class="badge ${p.deployed ? 'ok' : ''}">Publicado</span>
              <span class="badge ${p.pr ? 'ok' : ''}">PR</span>
              <span class="badge ${p.release ? 'ok' : ''}">Respaldo</span>
            </span>
            <span class="score">${p.score}</span>
          </li>`).join('');
      } catch {
        document.getElementById('status').textContent = 'Sin conexión con el servidor del marcador';
      }
    }
    load();
    setInterval(load, 10000);
  </script>
</body>
</html>
